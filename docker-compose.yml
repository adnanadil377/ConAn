# ─────────────────────────────────────────
#  GitHub Contribution Analytics Lakehouse
#  Local Docker Compose Stack
# ─────────────────────────────────────────

x-spark-common: &spark-common
  image: apache/spark:3.5.3
  command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
  environment:
    - SPARK_WORKER_CORES=2
    - SPARK_WORKER_MEMORY=2G
    - AWS_ACCESS_KEY_ID=minioadmin
    - AWS_SECRET_ACCESS_KEY=minioadmin
  volumes:
    - ./spark:/opt/spark/work-dir
  depends_on:
    - spark-master
  networks:
    - lakehouse

services:

  # ── Messaging ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - lakehouse

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - lakehouse

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - lakehouse

  # ── Object Storage (S3-compatible) ────────────────────────────────────────
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - lakehouse

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/lakehouse;
      mc mb --ignore-existing local/warehouse;
      mc mb --ignore-existing local/raw;
      echo 'Buckets created successfully.';
      "
    networks:
      - lakehouse

  # ── Apache Spark ──────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./spark:/opt/spark/work-dir
    ports:
      - "7077:7077"   # Spark master
      - "8080:8080"   # Spark UI
    networks:
      - lakehouse

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    ports:
      - "8081:8081"

  # ── Hive Metastore (Optional profile) ──────────────────────────────────────
  hive-metastore-db:
    image: postgres:15
    container_name: hive-metastore-db
    profiles: ["metastore"]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-meta-data:/var/lib/postgresql/data
    networks:
      - lakehouse

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    profiles: ["metastore"]
    depends_on:
      - hive-metastore-db
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "9083:9083"
    networks:
      - lakehouse

  # ── Serving Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: github_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - lakehouse

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  # Start with: docker compose --profile app up
  api:
    build:
      context: ./serving/api
      dockerfile: Dockerfile
    container_name: api
    profiles: ["app"]
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analytics:analytics@postgres:5432/github_analytics
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./serving/api:/app
    networks:
      - lakehouse

  # ── React Frontend ────────────────────────────────────────────────────────
  # Start with: docker compose --profile app up
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    profiles: ["app"]
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - lakehouse

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  minio-data:
  postgres-data:
  hive-meta-data:

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  lakehouse:
    driver: bridge
