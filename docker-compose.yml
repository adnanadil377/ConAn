# ─────────────────────────────────────────
#  GitHub Contribution Analytics Lakehouse
#  Local Docker Compose Stack
# ─────────────────────────────────────────

x-spark-common: &spark-common
  image: apache/spark:3.5.3
  command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
  environment:
    - SPARK_WORKER_CORES=2
    - SPARK_WORKER_MEMORY=2G
    - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    # Pre-populate Ivy cache location for spark --packages (persisted via volume)
    - SPARK_HOME=/opt/spark
  volumes:
    - ./spark:/opt/spark/work-dir
    - spark-ivy-cache:/root/.ivy2
  depends_on:
    - spark-master
    - namenode
  networks:
    - lakehouse

services:

  # ── Messaging ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - lakehouse

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - lakehouse

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - lakehouse

  # Polls GitHub Events API and publishes PushEvents → Kafka topic
  kafka-producer:
    build:
      context: ./ingestion/streaming
      dockerfile: Dockerfile
    container_name: kafka-producer
    depends_on:
      - kafka
      - api
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: github.events.raw
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      API_URL: http://api:8000
    command: python kafka_producer.py --interval 30
    networks:
      - lakehouse
    restart: unless-stopped

  # ── HDFS ─────────────────────────────────────────────────────────────────
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    environment:
      CLUSTER_NAME: github-analytics
      ENSURE_NAMENODE_DIR: /data/name/current
      CORE-SITE.XML_fs.default.name: hdfs://namenode:9000
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.namenode.rpc-address: 0.0.0.0:9000
      HDFS-SITE.XML_dfs.namenode.name.dir: /data/name
      HDFS-SITE.XML_dfs.replication: 1
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
    ports:
      - "9000:9000"   # HDFS RPC
      - "9870:9870"   # NameNode Web UI
    volumes:
      - hdfs-name:/data/name
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "hdfs", "dfsadmin", "-fs", "hdfs://namenode:9000", "-report"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    environment:
      CORE-SITE.XML_fs.default.name: hdfs://namenode:9000
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.datanode.data.dir: /data/data
      HDFS-SITE.XML_dfs.datanode.data.dir.perm: "777"
      HDFS-SITE.XML_dfs.replication: 1
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
    depends_on:
      - namenode
    volumes:
      - hdfs-data:/data/data
    networks:
      - lakehouse

  hdfs-init:
    image: apache/hadoop:3.3.6
    container_name: hdfs-init
    user: root
    depends_on:
      - namenode
      - datanode
    entrypoint: >
      /bin/sh -c "
      until hdfs dfsadmin -fs hdfs://namenode:9000 -safemode get 2>/dev/null | grep -q 'Safe mode is OFF'; do
        echo 'Waiting for NameNode to leave safe mode...';
        hdfs dfsadmin -fs hdfs://namenode:9000 -safemode leave 2>/dev/null || true;
        sleep 5;
      done;
      hdfs dfs -mkdir -p hdfs://namenode:9000/raw/git_events;
      hdfs dfs -mkdir -p hdfs://namenode:9000/warehouse/data;
      hdfs dfs -mkdir -p hdfs://namenode:9000/jars;
      hdfs dfs -chmod -R 777 hdfs://namenode:9000/;
      echo 'HDFS directories created successfully.';
      "
    environment:
      CORE-SITE.XML_fs.default.name: hdfs://namenode:9000
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
    networks:
      - lakehouse

  # ── Apache Spark ──────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_HOME=/opt/spark
    volumes:
      - ./spark:/opt/spark/work-dir
      - spark-ivy-cache:/root/.ivy2
    ports:
      - "7077:7077"   # Spark master RPC
      - "8080:8080"   # Spark master Web UI
      - "6066:6066"   # Spark REST submission API
    depends_on:
      - namenode
    networks:
      - lakehouse

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    ports:
      - "8081:8081"

  # ── Serving Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: github_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d github_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ./serving/api
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      - postgres
      - namenode
      - kafka
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analytics:analytics@postgres:5432/github_analytics
      HDFS_NAMENODE_URL: http://namenode:9870
      HDFS_BASE_PATH: /raw
      HDFS_USER: root
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: github.events.raw
      HDFS_FLUSH_THRESHOLD: "20"
      HDFS_FLUSH_INTERVAL: "60"
      # Docker socket path for triggering Spark jobs
      DOCKER_HOST: unix:///var/run/docker.sock
      SPARK_MASTER_CONTAINER: spark-master
    volumes:
      - ./serving/api:/app
      # Mount streaming consumer so FastAPI can import kafka_consumer at runtime
      - ./ingestion/streaming:/ingestion/streaming:ro
      # Mount Docker socket so the API can exec into spark-master to run spark-submit
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lakehouse

  # ── React Frontend ────────────────────────────────────────────────────────
  # Start with: docker compose --profile app up
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BACKEND=http://api:8000
    depends_on:
      - api
    networks:
      - lakehouse

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  hdfs-name:
  hdfs-data:
  postgres-data:
  spark-ivy-cache:   # Persists Ivy/Maven packages downloaded by spark --packages

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  lakehouse:
    driver: bridge
