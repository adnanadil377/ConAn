# ─────────────────────────────────────────
#  GitHub Contribution Analytics Lakehouse
#  Local Docker Compose Stack
# ─────────────────────────────────────────

x-spark-common: &spark-common
  image: apache/spark:3.5.3
  command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
  environment:
    - SPARK_WORKER_CORES=2
    - SPARK_WORKER_MEMORY=2G
    - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
  volumes:
    - ./spark:/opt/spark/work-dir
  depends_on:
    - spark-master
    - namenode
  networks:
    - lakehouse

services:

  # ── Messaging ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - lakehouse

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - lakehouse

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - lakehouse

  # ── HDFS ─────────────────────────────────────────────────────────────────
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    environment:
      CLUSTER_NAME: github-analytics
      ENSURE_NAMENODE_DIR: /data/name/current
      CORE-SITE.XML_fs.default.name: hdfs://namenode:9000
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.namenode.rpc-address: 0.0.0.0:9000
      HDFS-SITE.XML_dfs.namenode.name.dir: /data/name
      HDFS-SITE.XML_dfs.replication: 1
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
    ports:
      - "9000:9000"   # HDFS RPC
      - "9870:9870"   # NameNode Web UI
    volumes:
      - hdfs-name:/data/name
    networks:
      - lakehouse

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    environment:
      CORE-SITE.XML_fs.default.name: hdfs://namenode:9000
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.datanode.data.dir: /data/data
      HDFS-SITE.XML_dfs.datanode.data.dir.perm: "777"
      HDFS-SITE.XML_dfs.replication: 1
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
    depends_on:
      - namenode
    volumes:
      - hdfs-data:/data/data
    networks:
      - lakehouse

  hdfs-init:
    image: apache/hadoop:3.3.6
    container_name: hdfs-init
    user: root
    depends_on:
      - namenode
      - datanode
    entrypoint: >
      /bin/sh -c "
      until hdfs dfsadmin -fs hdfs://namenode:9000 -safemode get 2>/dev/null | grep -q 'Safe mode is OFF'; do
        echo 'Waiting for NameNode to be ready and leave safe mode...';
        hdfs dfsadmin -fs hdfs://namenode:9000 -safemode leave 2>/dev/null || true;
        sleep 3;
      done;
      hdfs dfs -mkdir -p hdfs://namenode:9000/raw/git_events;
      hdfs dfs -mkdir -p hdfs://namenode:9000/warehouse;
      hdfs dfs -mkdir -p hdfs://namenode:9000/lakehouse;
      hdfs dfs -chmod -R 777 hdfs://namenode:9000/;
      echo 'HDFS directories created successfully.';
      "
    environment:
      CORE-SITE.XML_fs.default.name: hdfs://namenode:9000
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
    networks:
      - lakehouse

  # ── Apache Spark ──────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./spark:/opt/spark/work-dir
    ports:
      - "7077:7077"   # Spark master
      - "8080:8080"   # Spark UI
    depends_on:
      - namenode
    networks:
      - lakehouse

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    ports:
      - "8081:8081"

  # ── Hive Metastore (Optional profile) ──────────────────────────────────────
  hive-metastore-db:
    image: postgres:15
    container_name: hive-metastore-db
    profiles: ["metastore"]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-meta-data:/var/lib/postgresql/data
    networks:
      - lakehouse

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    profiles: ["metastore"]
    depends_on:
      - hive-metastore-db
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "9083:9083"
    networks:
      - lakehouse

  # ── Serving Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: github_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - lakehouse

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  # Start with: docker compose --profile app up
  api:
    build:
      context: ./serving/api
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      - postgres
      - namenode
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analytics:analytics@postgres:5432/github_analytics
      HDFS_NAMENODE_URL: http://namenode:9870
      HDFS_BASE_PATH: /raw
      HDFS_USER: root
    volumes:
      - ./serving/api:/app
    networks:
      - lakehouse

  # ── React Frontend ────────────────────────────────────────────────────────
  # Start with: docker compose --profile app up
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BACKEND=http://api:8000
    depends_on:
      - api
    networks:
      - lakehouse

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  hdfs-name:
  hdfs-data:
  postgres-data:
  hive-meta-data:

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  lakehouse:
    driver: bridge
